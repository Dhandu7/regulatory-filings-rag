[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "regrag"
version = "0.1.0"
description = "Regulatory filings (OEB / EDGAR) -> medallion pipeline -> RAG index with cited QA"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "tenacity>=8.2",
  "fsspec>=2024.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "pdfplumber>=0.11",
  "pypdf>=4",
  "pyyaml>=6",
  "numpy>=1.26",
  "tiktoken>=0.7",
  "fastembed>=0.4",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "langchain-core>=0.3",
  "anthropic>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# dbt runs locally against DuckDB; on Databricks it runs as a dbt task with dbt-databricks instead,
# so it stays out of the wheel's core dependencies.
dbt = ["dbt-duckdb>=1.8"]
ops = ["prefect>=3.0"]
cloud = ["s3fs", "gcsfs"]
dev = ["pytest>=8", "httpx>=0.27", "fpdf2>=2.7", "ruff>=0.5", "dbt-duckdb>=1.8"]

[project.scripts]
regrag = "regrag.cli:main"
regrag-job = "regrag.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regrag = ["serve/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: hits live regulator endpoints (deselect with -m 'not network')"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]   # `l` over lines reads fine; zip(strict=) is noise for same-length pairs
