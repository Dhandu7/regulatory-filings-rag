# Local: DuckDB reading the Parquet lake directly.
# Databricks: set DBT_TARGET=databricks and the DATABRICKS_* env vars; the silver tables are then
# Delta tables written by the Spark job in databricks/ (see databricks/README.md).
regrag:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('REGRAG_DBT_DUCKDB', '../data/dbt.duckdb') }}"
      threads: 4
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      schema: regrag
      threads: 4
