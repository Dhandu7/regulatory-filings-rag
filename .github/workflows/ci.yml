name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 11 * * *"   # nightly live-source smoke test

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit + pipeline + dbt tests (offline)
        run: pytest -m "not network"

  pgvector-integration:
    # Exercises the real pgvector store (HNSW + full-text hybrid) against a Postgres service.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: utility_rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/utility_rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_pgvector.py

  docker:
    # Builds the image and smoke-tests the compose stack: API health, console page, CLI inside the container.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: API and console respond
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ | grep -q "Regulatory Filings RAG"
      - name: CLI works inside the container
        run: |
          docker compose exec -T api regrag versions
          docker compose exec -T api regrag rechunk
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - name: Tear down
        if: always()
        run: docker compose down -v

  live-source-smoke:
    # Nightly check that the regulator APIs haven't changed shape (the most likely silent failure).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest -m network
        env:
          REGRAG_USER_AGENT: ${{ vars.REGRAG_USER_AGENT }}
